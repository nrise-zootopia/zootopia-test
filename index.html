function server(method,payload){return new Promise((resolve,reject)=>{if(!hasGAS){reject(Error('미리보기 모드에서는 회사 인증과 결과 저장을 사용할 수 없습니다.'));return;}let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e))));if(method==='getSession')runner.getSession();else runner.saveResult(payload);});}
function render(){
 if(state.step==='home'){app.innerHTML=`<div class="center"><div class="eyebrow">NRISE 전용 동물 본능 테스트</div><h1>나의 주토피아<br>동물 본능은? 🐾</h1><p class="muted">회사 생활부터 일상 속 도파민까지!<br>20개의 선택으로 나의 동물 주민증을 만나봐요.</p><div class="chips">🦒 🐰 🦊 🐻 🐸 🐑</div><p class="muted">약 3~4분 · 1인 1회 참여</p><button class="btn" id="start">주토피아 입장하기 →</button>${!hasGAS?'<p class="muted" style="font-size:12px">현재는 로컬 미리보기 모드입니다. 인증·저장은 GAS 배포 후 작동합니다.</p>':''}</div>`;document.getElementById('start').onclick=()=>{state.step='register';render()};}
 else if(state.step==='register'){app.innerHTML=`<div class="eyebrow">STEP 01 · 주민 등록</div><h2>반가워요, 새로운 주민님! 💜</h2><p class="muted">회사 계정으로 인증하고 주민증을 발급받아 보세요.</p><label class="field">이름<input id="name" maxlength="24" placeholder="이름을 입력해 주세요" value="${esc(state.name)}"></label><label class="field">회사 이메일<input id="email" type="email" placeholder="name@nrise.net" value="${esc(state.email)}" ${hasGAS?'readonly':''}></label><div id="msg"></div><button class="btn" id="go">테스트 시작하기</button><button class="back" id="back">← 이전으로</button>`;document.getElementById('back').onclick=()=>{state.step='home';render()};if(hasGAS){server('getSession').then(s=>{state.session=s;if(!s.allowed){message(s.message);document.getElementById('go').disabled=true;}else{document.getElementById('email').value=s.email;if(s.duplicate){message('이미 참여한 회사 계정입니다. 중복 참여는 불가능해요.');document.getElementById('go').disabled=true;}}}).catch(e=>message(e.message));}document.getElementById('go').onclick=()=>{state.name=document.getElementById('name').value.trim();state.email=document.getElementById('email').value.trim().toLowerCase();if(!state.name||state.name.length>24)return message('이름은 1~24자로 입력해 주세요.');if(!/^\S+@nrise\.net$/.test(state.email))return message('회사 이메일(@nrise.net)을 입력해 주세요.');state.step='quiz';render()};}
 else if(state.step==='quiz'){const i=state.answers.length,q=QUESTIONS[i];app.innerHTML=`<div class="step">QUESTION ${i+1} / 20</div><div class="progress"><div style="width:${i/20*100}%"></div></div><h2>${esc(q[0])}</h2><button class="option" id="a"><b>A.</b> ${esc(q[1])}</button><button class="option" id="b"><b>B.</b> ${esc(q[2])}</button><button class="back" id="prev">← 이전 질문</button>`;document.getElementById('a').onclick=()=>answer(0);document.getElementById('b').onclick=()=>answer(1);document.getElementById('prev').onclick=()=>{if(state.answers.length)state.answers.pop();else state.step='register';render()};}
 else if(state.step==='tie'){const w=state.tie;app.innerHTML=`<div class="center"><div class="eyebrow">BONUS QUESTION ✨</div><h2>당신의 진짜 동물 본능은?</h2><p class="muted">아래 설명 중 나와 가장 가까운 하나를 골라주세요.</p></div>${w.map(t=>`<button class="option" data-t="${t}">${esc(ANIMALS[t][7])}</button>`).join('')}<div id="msg"></div>`;app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>save(b.dataset.t));}
 else if(state.step==='loading'){app.innerHTML='<div class="center"><div class="loader">🐾</div><h2>동물 본능 분석 중...</h2><p class="muted">당신의 주토피아 주민증을 발급하고 있어요!</p></div>';}
 else if(state.step==='result'){const a=ANIMALS[state.result];app.innerHTML=renderResultCard(a);document.getElementById('share').onclick=()=>window.print();}
 else if(state.step==='duplicate'){app.innerHTML='<div class="center"><h2>이미 참여했어요! 🐾</h2><p>한 사람당 한 번만 참여할 수 있어요.</p></div>';}
 else if(state.step==='error'){app.innerHTML=`<h2>잠시 문제가 생겼어요 🥲</h2><div class="error">${esc(state.error)}</div><button class="btn" id="retry">다시 시도하기</button>`;document.getElementById('retry').onclick=()=>{state.step=state.answers.length===20?'tie':'register';if(state.step==='tie'&&!state.tie)state.step='register';render()};}
}

function cardSrc(file){return PORTRAITS[file]||'';}
function message(s){document.getElementById('msg').innerHTML=`<div class="error">${esc(s)}</div>`;}
function answer(v){state.answers.push(v);if(state.answers.length===20)finish();else render();}
function localEval(){const scores=Object.fromEntries(names.map(t=>[t,0]));state.answers.forEach((v,i)=>scores[QUESTIONS[i][3+v]]++);const winners=names.filter(t=>names.every(u=>scores[t]*COUNTS[u]>=scores[u]*COUNTS[t]));return winners;}
async function finish(){const winners=localEval();if(winners.length>1){state.tie=winners;state.step='tie';render();return;}await save(winners[0]);}
async function save(choice){state.step='loading';render();if(!hasGAS){state.result=choice;state.step='result';render();return;}try{const r=await server('saveResult',{name:state.name,answers:state.answers,tieChoice:choice});if(r.duplicate){state.step='duplicate';}else if(r.needsTie){state.tie=r.winners;state.step='tie';}else if(r.success){state.result=r.animal;state.step='result';}else throw Error('결과 저장에 실패했습니다.');}catch(e){state.error=e.message;state.step='error';}render();}

 const copy=CARD_COPY[key];
 const code=animalCode(a[2]);
 const card=`<div class="resident-card-wrap"><div class="resident-clip" aria-hidden="true"></div><article class="resident-card"><div class="card-top"><div class="logo-block"><div class="paw-wrap">${pawSvg()}</div><div class="id-brand">NRISE ZOOTOPIA<span>RESIDENT ID</span></div></div><div class="number">No. ${esc(code)}</div></div><div class="card-main"><img class="avatar" src="${cardSrc(a[2])}" alt="${esc(a[0])} 캐릭터"><div class="details"><div class="watermark" aria-hidden="true">${pawSvg()}</div><div class="animal">${esc(a[0])} <span class="resident">주민</span></div><div class="tag">${esc(copy.badge)}</div><div class="meta">${metaIcon('pin')}<span class="meta-label">서식지</span><span class="meta-value">${esc(a[1])}</span></div><div class="meta">${metaIcon('heart')}<span class="meta-label">키워드</span><span class="meta-value">${esc(copy.keywords)}</span></div></div></div><div class="bottom"><div class="info-item"><div class="info-title">${infoIcon('strength')}강점</div><div class="info-copy">${esc(copy.strength).replace(/\n/g,'<br>')}</div></div><div class="info-item"><div class="info-title">${infoIcon('charm')}반전 매력</div><div class="info-copy">${esc(copy.charm).replace(/\n/g,'<br>')}</div></div><div class="info-item"><div class="info-title">${infoIcon('match')}찰떡궁합</div><div class="info-copy match">${esc(copy.match)}</div></div></div></article></div>`;
 return `<div class="result-wrap"><div class="result-title center"><div class="eyebrow">WELCOME TO ZOOTOPIA!</div><h2>${esc(state.name)}님의 동물 주민증 도착! 🎉</h2><p class="muted">당신은 ${esc(a[1])}에 사는 ${esc(a[0])} 주민!</p></div>${card}<div class="result-detail"><strong>💜 ${esc(a[3])}</strong><p>${esc(a[4])}</p><p>🤫 반전 매력 · ${esc(a[5])}</p><p>💕 찰떡궁합 · ${esc(a[6])}</p></div><button class="btn" id="share">화면 인쇄 또는 PDF 저장하기 ↓</button><p class="save-note">회사 계정당 한 번만 참여할 수 있어요.</p></div>`;
}


render();
</script></body></html>
