<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOOTOPIA | 동물 본능 테스트</title><style>
:root{--ink:#253047;--muted:#69738b;--bg:#f6f5ff;--purple:#7358d7;--yellow:#ffe28a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:radial-gradient(circle at 12% 5%,#e7dfff,transparent 35%),radial-gradient(circle at 90% 30%,#fff1c9,transparent 35%),var(--bg);color:var(--ink);min-height:100vh}.shell{max-width:650px;margin:0 auto;padding:24px 17px 60px}.card{background:#fff;border:2px solid #edeafa;border-radius:28px;padding:28px 23px;box-shadow:0 16px 35px #4c39941a}.brand{font-size:13px;letter-spacing:3px;font-weight:900;color:var(--purple)}h1{font-size:clamp(30px,7vw,45px);line-height:1.2;margin:15px 0}h2{font-size:25px;margin:12px 0}.sub{color:var(--muted);line-height:1.8}.mascots{font-size:54px;letter-spacing:5px;margin:28px 0}.pill{display:inline-block;background:#f0ebff;color:#6247bf;padding:9px 14px;border-radius:50px;font-weight:800;font-size:13px}.btn{background:var(--purple);color:white;border:0;border-radius:16px;padding:17px 21px;font-size:16px;font-weight:850;cursor:pointer;width:100%;margin-top:14px}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#f2effd;color:#5d4db3}.progress{height:10px;background:#eeebf8;border-radius:20px;overflow:hidden;margin:17px 0 26px}.bar{height:100%;background:linear-gradient(90deg,#ad8aff,#6953d4);transition:width .25s}.question{font-size:23px;font-weight:900;line-height:1.55;margin:35px 0 25px;min-height:110px}.choice{width:100%;border:2px solid #e5e0f8;background:white;padding:20px 15px;border-radius:18px;margin:8px 0;font-weight:850;font-size:17px;cursor:pointer;text-align:left}.choice:hover,.choice:focus{border-color:var(--purple);background:#f8f5ff}.choice span{margin-right:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:13px;color:var(--muted)}.animal{font-size:88px;margin:14px 0}.result{background:linear-gradient(145deg,#f0eaff,#fff8e8);border-radius:22px;padding:22px;text-align:center;margin:20px 0}.result h2{font-size:30px}.tag{display:inline-block;border-radius:20px;padding:7px 13px;background:white;color:#6855bb;font-weight:850;font-size:13px}.scoreline{display:grid;grid-template-columns:80px 1fr 35px;gap:9px;align-items:center;margin:12px 0;font-size:13px}.track{height:9px;background:#ece8f7;border-radius:20px;overflow:hidden}.fill{height:100%;background:#9b82ea}.note{font-size:13px;color:#777;line-height:1.7;margin-top:18px}input{font-size:17px;padding:15px;border:2px solid #e5e0f8;border-radius:14px;width:100%;margin-top:10px}#app{min-height:450px}@media(max-width:450px){.card{padding:23px 19px}.question{font-size:21px}}
</style></head><body><form name="zootopia-results" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="form-name" value="zootopia-results"><input name="bot-field"><input name="participant"><input name="habitat"><input name="animal"><input name="type"><input name="score"><input name="answers"></form><main class="shell"><div id="app" class="card"></div></main><script>
const zones=[{name:'해양',animal:'물개',emoji:'🦭',other:'돌고래 · 수달 · 물개',label:'흥 넘치는 자유 영혼',desc:'재밌는 일이 생기면 일단 뛰어들고 보는 당신! 신나는 경험과 즉흥적인 즐거움이 삶의 에너지예요.',quote:'일단 놀고 생각은 나중에!'},{name:'습지',animal:'카피바라',emoji:'🦫',other:'카피바라 · 개구리 · 악어',label:'평화로운 리액션 요정',desc:'깜짝 놀랄 땐 누구보다 리액션이 크지만, 평소엔 갈등보다 평화를 사랑하는 따뜻한 타입이에요.',quote:'우리 좋게 좋게 가자~'},{name:'툰드라',animal:'북극여우',emoji:'🦊',other:'북극여우 · 북극곰 · 순록',label:'반전 매력 집순이·집돌이',desc:'에너지를 아껴 쓰고 혼자만의 시간으로 충전하는 당신! 친해진 사람 앞에서는 숨겨둔 개그 본능이 폭발해요.',quote:'집에 가서 충전할 시간입니다.'},{name:'산악',animal:'산양',emoji:'🐐',other:'산양 · 눈표범 · 독수리',label:'은근한 승부욕의 화신',desc:'장난으로 시작한 게임도 어느새 진심이 되는 당신! 어려운 도전일수록 승부욕이 활활 타올라요.',quote:'한 판만 더. 이번엔 진짜야.'},{name:'열대우림',animal:'앵무새',emoji:'🦜',other:'앵무새 · 원숭이 · 나무늘보',label:'호기심 폭발 탐험가',desc:'궁금한 건 직접 해봐야 직성이 풀리는 당신! 남들이 예상하지 못한 아이디어와 엉뚱한 매력이 넘쳐요.',quote:'근데 이건 왜 그런 거야?'},{name:'사바나',animal:'사자',emoji:'🦁',other:'사자 · 기린 · 얼룩말',label:'우리 모임의 분위기 대장',desc:'모임에 생기를 불어넣고 사람들을 챙기는 당신! 모두가 즐거운 시간을 보내면 내가 더 행복해져요.',quote:'자자, 다들 모여봐!' }];
const questions=[
['배달 음식이 도착했다는 알림을 받으면 현관까지 뛰어간다.',0],
['모르는 강아지가 다가오면 사람보다 강아지에게 먼저 인사한다.',1],
['약속이 취소됐다는 연락에 나도 모르게 입꼬리가 올라간 적이 있다.',2],
["친구가 '너 이거 못 하지?'라고 하면 갑자기 자존심이 상한다.",3],
['처음 보는 메뉴가 있으면 맛이 궁금해서 시켜보고 싶다.',4],
['어색한 침묵이 흐르면 괜히 아무 말이나 던져 분위기를 살린다.',5],
['워터파크에 가면 남들이 쉬자고 할 때도 한 번 더 타고 싶다.',0],
['갑자기 벌레가 나타나면 벌레보다 내 비명에 주변 사람들이 놀란다.',1],
['회식 2차 이야기가 나오면 이미 마음속으로 귀가 경로를 검색한다.',2],
['인형 뽑기에 실패하면 “이번엔 될 것 같은데?” 하며 다시 도전한다.',3],
['궁금한 걸 검색하다가 원래 뭘 찾고 있었는지 잊은 적이 있다.',4],
['단체 사진을 찍을 때 웃긴 포즈를 먼저 제안할 수 있다.',5],
['여행은 관광 명소 도장 깨기보다 신나게 놀고 즐기는 게 더 좋다.',0],
['친구들끼리 의견이 갈리면 “그냥 둘 다 하자!”며 평화를 찾는다.',1],
['주말에 아무 약속 없이 집에서 쉬는 시간이 꼭 필요하다.',2],
['보드게임 중에는 친한 친구에게도 봐주는 법이 없다.',3],
['회사에서 간식이 들어왔다는 소식을 들으면 업무 집중력이 일시적으로 상승한다.',4],
['친구가 사진을 못 찍으면 마음에 들 때까지 다시 찍어달라고 한다.',5],
['갑자기 떠나는 드라이브나 여행 제안에 마음이 흔들린다.',0],
['누군가 실수했을 때 따지기보다 먼저 괜찮다고 말하는 편이다.',1],
['친한 사람들 앞에서만 보여주는 나만의 이상한 텐션이 있다.',2],
['게임에서 2등을 하면 축하하면서도 속으로 조금 아쉽다.',3],
['처음 가는 여행지에서는 유명한 곳보다 숨은 골목이 더 궁금하다.',4],
['친구의 생일이나 기념일을 챙기면 내가 더 뿌듯하다.',5]
];
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxmo1GEeIvf_KOliQ2RXJpMrdGXVUIW3_vbj_9wXeIVxCPf7lSjPcEC-swGbgZRGESZ/exec';
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let step=-1, answers=Array(questions.length).fill(null),name='',result=null,submitted=false,submitting=false,submitError='';const el=document.getElementById('app');
function render(){if(step===-1){el.innerHTML=`<div class="brand">WELCOME TO ZOOTOPIA</div><div class="mascots">🦊 🐰 🦁</div><h1>내 안에 숨어 있는<br>동물 본능은? 🐾</h1><p class="sub">인간인 줄 알았던 당신... 사실 주토피아 어딘가에 살고 있는 동물일지도?!<br>솔직한 대답으로 나의 서식지를 찾아보세요.</p><span class="pill">24문항 · 약 3분 · YES / NO</span><div style="margin-top:30px"><label for="nickname"><b>이름 또는 닉네임 (필수)</b></label><input id="nickname" maxlength="24" placeholder="예: 주디" autocomplete="off" required></div><button class="btn" id="start">주토피아 입국 심사 시작 →</button><p class="note">이 테스트는 행사에서 즐기는 재미용 성향 테스트이며, 이름과 검사 결과는 행사 운영진의 구글 스프레드시트로 전송됩니다. 개인정보 대신 닉네임을 사용해도 좋아요.</p>`;document.getElementById('start').onclick=()=>{name=document.getElementById('nickname').value.trim();if(!name){alert('결과를 저장하려면 이름 또는 닉네임을 입력해 주세요!');return}step=0;render()};return}
if(step<questions.length){const [q]=questions[step];el.innerHTML=`<div class="row"><div class="brand">ZOOTOPIA TEST</div><div class="small">${step+1} / ${questions.length}</div></div><div class="progress"><div class="bar" style="width:${step/questions.length*100}%"></div></div><span class="pill">${step<8?'PART 01 · 본능 탐색':step<16?'PART 02 · 성격 발견':'PART 03 · 정체 공개 직전'}</span><div class="question">Q${step+1}.<br>${q}</div><button class="choice" data-answer="yes"><span>⭕</span> 맞아! 완전 내 얘기</button><button class="choice" data-answer="no"><span>❌</span> 아니? 난 좀 다른데</button><button class="btn secondary" id="back" ${step===0?'disabled':''}>← 이전 질문</button><p class="note">정답은 없어요! 너무 오래 고민하지 말고 직감대로 골라주세요.</p>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[step]=b.dataset.answer==='yes';step++;render()});document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};return}
const scores=zones.map((_,z)=>questions.reduce((n,q,i)=>n+(q[1]===z&&answers[i]===true?1:0),0));const max=Math.max(...scores);let ties=scores.map((v,i)=>v===max?i:-1).filter(i=>i!==-1);if(result===null){if(ties.length>1){const noScores=zones.map((_,z)=>questions.reduce((n,q,i)=>n+(q[1]===z&&answers[i]===false?1:0),0)); // In a tie, use stable personal answer pattern to break it, without always favoring the first habitat.
let seed=answers.reduce((n,v,i)=>n+(v?(i+1)*7:(i+1)*3),0);result=ties[seed%ties.length]}else result=ties[0]}
const z=zones[result];el.innerHTML=`<div class="brand">ZOOTOPIA CITIZEN ID</div><div class="result"><div class="small">${name?escapeHtml(name)+'님의':'당신의'} 동물 본능 검사 결과</div><div class="animal">${z.emoji}</div><span class="tag">${z.name} 구역 주민 확정!</span><h2>${z.label}</h2><h3>당신의 대표 동물은 ${z.animal}!</h3><p class="sub">${z.desc}</p><b>“${z.quote}”</b></div><p><b>🎀 추천 머리띠</b><br>${z.other}</p><p><b>📊 나의 서식지 본능</b></p>${zones.map((item,i)=>`<div class="scoreline"><span>${item.name}</span><div class="track"><div class="fill" style="width:${scores[i]*25}%"></div></div><span>${scores[i]}/4</span></div>`).join('')}<div id="save-status" class="note" aria-live="polite"></div><button class="btn secondary" id="retry-save" style="display:none">결과 저장 다시 시도</button><button class="btn" id="copy">결과 복사하기 📋</button><button class="btn secondary" id="restart">처음부터 다시 하기</button><p class="note">🎟️ 머리띠 수령 시 운영진에게 이 화면을 보여주세요.<br>※ 재미를 위한 비공식 성향 테스트입니다. 동점 시 응답 패턴을 기준으로 한 서식지를 선정합니다.</p>`;document.getElementById('copy').onclick=async()=>{const txt=`🐾 주토피아 주민등록 결과\n${name||'참가자'}: ${z.name} 구역 / ${z.animal}\n${z.label}\n${z.desc}\n추천 머리띠: ${z.other}`;try{await navigator.clipboard.writeText(txt);document.getElementById('copy').textContent='복사 완료! 🎉'}catch(e){window.prompt('아래 결과를 복사해 주세요',txt)}};document.getElementById('restart').onclick=()=>{step=-1;answers.fill(null);result=null;submitted=false;submitting=false;submitError='';render()};document.getElementById('retry-save').onclick=()=>saveResult(scores,z);if(!submitted)saveResult(scores,z);else document.getElementById('save-status').textContent='✅ 결과 저장 완료! 운영진이 확인할 수 있어요.'}
async function saveResult(scores,z){
  if(submitted||submitting)return;
  submitting=true;
  const status=document.getElementById('save-status'),retry=document.getElementById('retry-save');
  if(status)status.textContent='⏳ 결과 전송 중...';
  if(retry)retry.style.display='none';
  try{
    // Apps Script expects JSON in e.postData.contents.
    // no-cors avoids browser CORS blocking but cannot read a success response.
    await fetch(SCRIPT_URL,{
      method:'POST',mode:'no-cors',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({name,habitat:z.name,animal:z.animal})
    });
    submitted=true;
    if(status)status.textContent='📨 결과 전송 요청 완료! 실제 저장 여부는 운영진의 구글 시트에서 확인해 주세요.';
  }catch(e){
    if(status)status.textContent='⚠️ 전송에 문제가 발생했어요. 다시 시도해 주세요.';
    if(retry)retry.style.display='block';
  }finally{submitting=false}
}
render();
</script></body></html>
