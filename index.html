:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#392650;background:#f8f4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 0%,#e8d9ff,transparent 37%),radial-gradient(circle at 95% 70%,#fce7f5,transparent 45%),#f8f4ff}.wrap{max-width:690px;margin:auto;padding:26px 16px 70px}.brand{text-align:center;font-weight:900;letter-spacing:.07em;color:#7956af;font-size:13px;margin:12px 0 28px}.panel{background:#fff;border:1px solid #e8dafa;box-shadow:0 18px 50px #7454a41b;border-radius:28px;padding:clamp(22px,5vw,40px)}.center{text-align:center}h1{font-size:clamp(27px,6vw,42px);line-height:1.25;margin:10px 0}h2{font-size:clamp(22px,5vw,30px);line-height:1.4}p{line-height:1.75}.muted{color:#82728e}.eyebrow{font-weight:800;color:#916cc2;font-size:13px;letter-spacing:.07em}.btn{border:0;background:#8c65c6;color:#fff;border-radius:17px;padding:16px 24px;font-size:16px;font-weight:800;cursor:pointer;width:100%;margin-top:16px;box-shadow:0 8px 20px #a37bc43d}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{background:#f1e9fc;color:#654594;box-shadow:none}.option{display:block;width:100%;border:2px solid #eadcf8;border-radius:19px;background:#fdfaff;color:#49325d;text-align:left;padding:18px;font-size:16px;line-height:1.55;cursor:pointer;margin:12px 0}.option:hover,.option:focus-visible{border-color:#9d76d6;background:#f5efff}.option b{color:#8a5cb7;margin-right:7px}.progress{height:10px;background:#f1e9fa;border-radius:20px;overflow:hidden;margin:16px 0 25px}.progress div{height:100%;background:linear-gradient(90deg,#d1a8e8,#8c65c6);transition:width .2s}.field{display:block;margin:18px 0;font-weight:700}.field input{display:block;width:100%;padding:15px;margin-top:8px;border:1px solid #d8c5ec;border-radius:13px;font-size:16px}.card-image{display:block;width:100%;height:auto;border-radius:16px}.detail{background:#f8f3ff;border-radius:17px;padding:15px;margin:15px 0}.error{color:#ad3264;background:#fff0f5;border-radius:12px;padding:12px;margin:15px 0}.chips{display:flex;justify-content:center;gap:12px;font-size:31px;margin:24px 0}.hidden{display:none!important}.step{color:#8e6ac0;font-weight:800}.back{background:none;border:0;color:#8062a9;cursor:pointer;margin-top:18px;font-size:14px}.loader{font-size:52px;animation:bounce 1s infinite alternate}@keyframes bounce{to{transform:translateY(-10px)}}@media(max-width:420px){.panel{padding:20px 16px}.option{padding:16px 13px}.wrap{padding:15px 12px 50px}}

.result-wrap{max-width:980px;margin:0 auto}

.resident-card-wrap{position:relative;width:min(100%,900px);margin:16px auto 18px;container-type:inline-size}
.resident-card{position:relative;isolation:isolate;width:100%;aspect-ratio:1.148/1;background:linear-gradient(155deg,#fffaff 0%,#fff 51%,#faf5ff 100%);border:2px solid #c9a9ec;border-radius:5.5cqw;box-shadow:0 .55cqw 1.3cqw #c1a6e63b, 0 1.5cqw 2.8cqw #8462ac24;overflow:hidden;padding:3.1cqw 2.25cqw 2.1cqw}
.resident-card::before{content:"";position:absolute;inset:.85cqw;border:1.3px solid #e6d5f6;border-radius:4.6cqw;pointer-events:none}

.card-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;height:15%;padding:.5cqw 1.3cqw 1.4cqw;border-bottom:1px solid #e3d4f3}
.logo-block{display:flex;align-items:center;gap:1cqw;line-height:1.1;font-family:'Jua','Arial Rounded MT Bold','Malgun Gothic',sans-serif}
.paw-wrap{width:8.7cqw;height:8.7cqw;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px #a980c039}
.paw-icon{width:7.1cqw;height:7.1cqw;display:block;filter:drop-shadow(0 .3cqw .25cqw #d3b5ea)}
.brand{font-size:3.3cqw;letter-spacing:-.01em;font-weight:800}
.brand span{display:block;font-weight:800;font-size:1.95cqw;letter-spacing:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}
.number{font-size:4.05cqw;white-space:nowrap;color:#2c174c;font-family:'Jua','Arial Rounded MT Bold','Malgun Gothic',sans-serif}
.card-main{position:relative;display:grid;grid-template-columns:40% 60%;align-items:center;height:52.4%;padding:2.4cqw 1.1cqw 1.7cqw;gap:1.2cqw}
.avatar{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4.3cqw;box-shadow:0 .6cqw 1.4cqw #8d6ab130}

.animal .resident{font-size:3.6cqw;vertical-align:middle;margin-left:.25cqw}
.tag{display:inline-flex;align-items:center;justify-content:center;margin:1.4cqw 0 2.2cqw;padding:.95cqw 3.1cqw .7cqw;border:1.7px solid #d7aefa;border-radius:10cqw;background:linear-gradient(180deg,#f0d8ff,#dfc2fd);box-shadow:0 .4cqw .8cqw #a88bce3a;color:#3c1c5d;font-size:4.05cqw;white-space:nowrap;font-family:'Jua','Arial Rounded MT Bold','Malgun Gothic',sans-serif}
.meta{display:flex;align-items:center;gap:.9cqw;font-size:3.02cqw;line-height:1.2;white-space:nowrap;margin:.7cqw 0;font-family:'Jua','Arial Rounded MT Bold','Malgun Gothic',sans-serif}
.meta-icon{width:4.5cqw;height:4.5cqw;flex-shrink:0}.meta-label{color:#5b3c82;margin-right:.4cqw}.meta-value{color:#24103f;letter-spacing:-.045em}
.watermark{position:absolute;right:1.5cqw;top:2cqw;width:11.4cqw;height:11.4cqw;opacity:.22;z-index:0}.watermark .paw-icon{width:100%;height:100%}.details>*:not(.watermark){position:relative;z-index:1}
.bottom{position:absolute;left:2.85cqw;right:2.85cqw;bottom:2.55cqw;z-index:2;height:26.2%;display:grid;grid-template-columns:1.04fr 1.12fr .83fr;border-radius:2.1cqw;background:linear-gradient(180deg,#f7f1ff9c,#f6eeff 100%);border:1px solid #e5d5f9;box-shadow:0 .18cqw .7cqw #b195d111;padding:1.1cqw .75cqw;align-items:stretch}
.info-item{min-width:0;text-align:center;padding:0 .8cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7cqw}.info-item+.info-item{border-left:1.5px solid #d1b3f4}
.info-title{display:flex;align-items:center;justify-content:center;gap:.55cqw;font-size:3.75cqw;white-space:nowrap;line-height:1.15;min-height:4.8cqw;margin:0;font-family:'Jua','Arial Rounded MT Bold','Malgun Gothic',sans-serif}
.illustration-icon{width:4.45cqw;height:4.45cqw;flex-shrink:0;filter:drop-shadow(0 .16cqw .2cqw #ab87c82d)}

.info-copy.match{font-size:4.9cqw;line-height:1.12}

</style></head><body><main class="wrap"><div class="brand">🐾 NRISE ZOOTOPIA 2.5 🐾</div><section class="panel" id="app"></section></main><script src="data.js"></script><script>
const app=document.getElementById('app');const state={step:'home',name:'',email:'',answers:[],tie:null,session:null,result:null};
const icons=['🦒','🐰','🦊','🐻','🐸','🐑'];
const names=Object.keys(ANIMALS);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasGAS=!!(window.google&&google.script&&google.script.run);
function server(method,payload){return new Promise((resolve,reject)=>{if(!hasGAS){reject(Error('미리보기 모드에서는 회사 인증과 결과 저장을 사용할 수 없습니다.'));return;}let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e))));if(method==='getSession')runner.getSession();else runner.saveResult(payload);});}
function render(){
 if(state.step==='home'){app.innerHTML=`<div class="center"><div class="eyebrow">NRISE 전용 동물 본능 테스트</div><h1>나의 주토피아<br>동물 본능은? 🐾</h1><p class="muted">회사 생활부터 일상 속 도파민까지!<br>20개의 선택으로 나의 동물 주민증을 만나봐요.</p><div class="chips">🦒 🐰 🦊 🐻 🐸 🐑</div><p class="muted">약 3~4분 · 1인 1회 참여</p><button class="btn" id="start">주토피아 입장하기 →</button>${!hasGAS?'<p class="muted" style="font-size:12px">현재는 로컬 미리보기 모드입니다. 인증·저장은 GAS 배포 후 작동합니다.</p>':''}</div>`;document.getElementById('start').onclick=()=>{state.step='register';render()};}
 else if(state.step==='register'){app.innerHTML=`<div class="eyebrow">STEP 01 · 주민 등록</div><h2>반가워요, 새로운 주민님! 💜</h2><p class="muted">회사 계정으로 인증하고 주민증을 발급받아 보세요.</p><label class="field">이름<input id="name" maxlength="24" placeholder="이름을 입력해 주세요" value="${esc(state.name)}"></label><label class="field">회사 이메일<input id="email" type="email" placeholder="name@nrise.net" value="${esc(state.email)}" ${hasGAS?'readonly':''}></label><div id="msg"></div><button class="btn" id="go">테스트 시작하기</button><button class="back" id="back">← 이전으로</button>`;document.getElementById('back').onclick=()=>{state.step='home';render()};if(hasGAS){server('getSession').then(s=>{state.session=s;if(!s.allowed){message(s.message);document.getElementById('go').disabled=true;}else{document.getElementById('email').value=s.email;if(s.duplicate){message('이미 참여한 회사 계정입니다. 중복 참여는 불가능해요.');document.getElementById('go').disabled=true;}}}).catch(e=>message(e.message));}document.getElementById('go').onclick=()=>{state.name=document.getElementById('name').value.trim();state.email=document.getElementById('email').value.trim().toLowerCase();if(!state.name||state.name.length>24)return message('이름은 1~24자로 입력해 주세요.');if(!/^\S+@nrise\.net$/.test(state.email))return message('회사 이메일(@nrise.net)을 입력해 주세요.');state.step='quiz';render()};}
 else if(state.step==='quiz'){const i=state.answers.length,q=QUESTIONS[i];app.innerHTML=`<div class="step">QUESTION ${i+1} / 20</div><div class="progress"><div style="width:${i/20*100}%"></div></div><h2>${esc(q[0])}</h2><button class="option" id="a"><b>A.</b> ${esc(q[1])}</button><button class="option" id="b"><b>B.</b> ${esc(q[2])}</button><button class="back" id="prev">← 이전 질문</button>`;document.getElementById('a').onclick=()=>answer(0);document.getElementById('b').onclick=()=>answer(1);document.getElementById('prev').onclick=()=>{if(state.answers.length)state.answers.pop();else state.step='register';render()};}
 else if(state.step==='tie'){const w=state.tie;app.innerHTML=`<div class="center"><div class="eyebrow">BONUS QUESTION ✨</div><h2>당신의 진짜 동물 본능은?</h2><p class="muted">아래 설명 중 나와 가장 가까운 하나를 골라주세요.</p></div>${w.map(t=>`<button class="option" data-t="${t}">${esc(ANIMALS[t][7])}</button>`).join('')}<div id="msg"></div>`;app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>save(b.dataset.t));}
 else if(state.step==='loading'){app.innerHTML='<div class="center"><div class="loader">🐾</div><h2>동물 본능 분석 중...</h2><p class="muted">당신의 주토피아 주민증을 발급하고 있어요!</p></div>';}
 else if(state.step==='result'){const a=ANIMALS[state.result];app.innerHTML=renderResultCard(a);document.getElementById('share').onclick=()=>window.print();}
 else if(state.step==='duplicate'){app.innerHTML='<div class="center"><h2>이미 참여했어요! 🐾</h2><p>한 사람당 한 번만 참여할 수 있어요.</p></div>';}
 else if(state.step==='error'){app.innerHTML=`<h2>잠시 문제가 생겼어요 🥲</h2><div class="error">${esc(state.error)}</div><button class="btn" id="retry">다시 시도하기</button>`;document.getElementById('retry').onclick=()=>{state.step=state.answers.length===20?'tie':'register';if(state.step==='tie'&&!state.tie)state.step='register';render()};}
}
function cardSrc(file){return 'assets/'+file;}
function message(s){document.getElementById('msg').innerHTML=`<div class="error">${esc(s)}</div>`;}
function answer(v){state.answers.push(v);if(state.answers.length===20)finish();else render();}
function localEval(){const scores=Object.fromEntries(names.map(t=>[t,0]));state.answers.forEach((v,i)=>scores[QUESTIONS[i][3+v]]++);const winners=names.filter(t=>names.every(u=>scores[t]*COUNTS[u]>=scores[u]*COUNTS[t]));return winners;}
async function finish(){const winners=localEval();if(winners.length>1){state.tie=winners;state.step='tie';render();return;}await save(winners[0]);}
async function save(choice){state.step='loading';render();if(!hasGAS){state.result=choice;state.step='result';render();return;}try{const r=await server('saveResult',{name:state.name,answers:state.answers,tieChoice:choice});if(r.duplicate){state.step='duplicate';}else if(r.needsTie){state.tie=r.winners;state.step='tie';}else if(r.success){state.result=r.animal;state.step='result';}else throw Error('결과 저장에 실패했습니다.');}catch(e){state.error=e.message;state.step='error';}render();}

function animalCode(file){const m=String(file).match(/^([A-Z]\d+)/);return m?m[1]:'';}
function metaIcon(type){
 if(type==='pin') return `<svg viewBox="0 0 30 30" class="meta-icon" aria-hidden="true"><path d="M15 27S6.2 16.3 6.2 12a8.8 8.8 0 1 1 17.6 0C23.8 16.3 15 27 15 27Z" fill="#a36bd0" stroke="#7447a1" stroke-width="1.8"/><circle cx="15" cy="12" r="3.2" fill="#fff9ff"/></svg>`;
 if(type==='heart') return `<svg viewBox="0 0 30 30" class="meta-icon" aria-hidden="true"><path d="M15 25S3 16.8 3 10A7 7 0 0 1 15 6.5 7 7 0 0 1 27 10c0 6.8-12 15-12 15Z" fill="#a673d2" stroke="#7a4aa8" stroke-width="1.7"/></svg>`;
 return '';
}
function pawSvg(cls='paw-icon'){return `<svg viewBox="0 0 62 62" class="${cls}" aria-hidden="true"><g fill="#9a62c5" stroke="#7843a8" stroke-width="1.5"><ellipse cx="12.5" cy="18" rx="7" ry="10" transform="rotate(-25 12.5 18)"/><ellipse cx="26" cy="10" rx="6.6" ry="10" transform="rotate(-7 26 10)"/><ellipse cx="40" cy="12" rx="6.6" ry="10" transform="rotate(11 40 12)"/><ellipse cx="51.5" cy="23" rx="6.1" ry="9.3" transform="rotate(27 51.5 23)"/><path d="M31 25C24 25 21 31 17 36C11 43 17 52 24 50C29 48 33 49 38 51C46 54 52 46 47 39C43 33 38 25 31 25Z"/></g></svg>`;}
function infoIcon(type){
 if(type==='strength') return `<svg viewBox="0 0 42 42" class="illustration-icon" aria-hidden="true"><path d="M21 3.7l5.1 10.2 11.3 1.7-8.2 8 1.9 11.3L21 29.5l-10.1 5.4 1.9-11.3-8.2-8 11.3-1.7z" fill="#ffe48a" stroke="#8757b8" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 20.2h.1M25 20.2h.1" stroke="#73569c" stroke-width="2.8" stroke-linecap="round"/><path d="M18 24q3 2.5 6 0" fill="none" stroke="#73569c" stroke-width="1.7" stroke-linecap="round"/></svg>`;
 if(type==='charm') return `<svg viewBox="0 0 42 42" class="illustration-icon" aria-hidden="true"><path d="M21 36C16 31.6 4.8 23.2 4.8 14.8c0-8 10-12.2 16.2-4.2 6.2-8 16.2-3.8 16.2 4.2 0 8.4-11.2 16.8-16.2 21.2Z" fill="#ffb9da" stroke="#905dc4" stroke-width="2.6" stroke-linejoin="round"/><path d="M11 12q2.5-4 5.4-2.3" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>`;
 return `<svg viewBox="0 0 42 42" class="illustration-icon" aria-hidden="true"><g fill="none" stroke="#8753be" stroke-width="7.5" stroke-linecap="round"><path d="M17 17l-4 4A9 9 0 0 0 26 34l4-4"/><path d="M25 25l4-4A9 9 0 0 0 16 8l-4 4"/></g><path d="M15 27L27 15" stroke="#dfbaff" stroke-width="6.1" stroke-linecap="round"/><path d="M34 4l1.5 4L40 10l-4.5 1.5L34 16l-1.5-4.5L28 10l4.5-2z" fill="#ffe090"/></svg>`;
}
const CARD_COPY={
 giraffe:{badge:'아이디어 뱅크',keywords:'창의력 · 호기심 · 열린 사고',strength:'새로운 가능성을 찾는\n아이디어',charm:'생각이 많아 가끔\n행동이 느려요',match:'곰'},
 rabbit:{badge:'센스쟁이 관찰러',keywords:'관찰력 · 세심함 · 빠른 눈치',strength:'작은 변화도 놓치지 않는\n섬세함',charm:'조용하지만\n열정적이에요',match:'양'},
 fox:{badge:'기회 포착의 달인',keywords:'분석력 · 전략 · 효율성',strength:'상황을 빠르게 읽는\n판단력',charm:'가끔은 팀을 위해\n많이 고민해요',match:'기린'},
 bear:{badge:'추진력 대장',keywords:'추진력 · 책임감 · 끈기',strength:'결정하면 바로 움직이는\n실행력',charm:'든든하지만\n달콤한 휴식도 필요해요',match:'여우'},
 frog:{badge:'에너자이저',keywords:'사교성 · 적응력 · 긍정 에너지',strength:'어디서든 분위기를\n살리는 능력',charm:'늘 활발해 보이지만\n혼자만의 충전 시간도 필요해요',match:'토끼'},
 sheep:{badge:'평화로운 공감 요정',keywords:'공감력 · 배려 · 팀워크',strength:'주변을 따뜻하게\n챙기는 마음',charm:'평화주의자지만\n필요할 땐 단호해요',match:'곰'}
};
function renderResultCard(a){
 const key=state.result;
